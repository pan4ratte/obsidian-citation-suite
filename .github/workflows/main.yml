name: Build, Attest, and Release

# Releases automatically when the version in manifest.json is bumped on main.
# manifest.json is the source of truth: its version becomes the release tag,
# which is what Obsidian (and BRAT) read. No manual tagging required.
on:
  push:
    branches:
      - main
    paths:
      - manifest.json
  workflow_dispatch:

jobs:
  # Decide whether this push introduced a new, not-yet-released version.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      # Guard: manifest.json and package.json must declare the same version, so
      # a release is never cut with mismatched metadata.
      - name: Verify manifest.json and package.json versions match
        run: |
          MANIFEST_VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Version mismatch: manifest.json is $MANIFEST_VERSION but package.json is $PACKAGE_VERSION. Bump both to the same value."
            exit 1
          fi
          echo "Versions match: $MANIFEST_VERSION"

      # versions.json is read from the repository rather than from the release
      # assets, and it is what lets an older Obsidian keep offering the last
      # release it can actually run. A release missing from it stays invisible
      # to that check forever after.
      - name: Verify the version is listed in versions.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LISTED="$(node -p "require('./versions.json')[process.argv[1]] || ''" "$VERSION")"
          if [ -z "$LISTED" ]; then
            echo "::error::$VERSION is not in versions.json. Add it, mapped to the minAppVersion this release ships with."
            exit 1
          fi
          echo "versions.json maps $VERSION to $LISTED"

      # The release body is this version's section of CHANGELOG.md. A missing
      # one means the heading was never renamed from the unreleased one — and
      # since both changelogs are shipped inside main.js and picked between by
      # locale, the Russian one has to be renamed in the same commit.
      - name: Verify the changelog has a section for the version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for f in CHANGELOG.md CHANGELOG_RU.md; do
            if ! grep -q "^## $VERSION\$" "$f"; then
              echo "::error::$f has no '## $VERSION' section. Rename the unreleased heading in CHANGELOG_RU.md and CHANGELOG.md both."
              exit 1
            fi
          done

      # Skip if this version already has a release, so re-runs and unrelated
      # manifest.json edits (a description tweak, say) never attempt a duplicate.
      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION is not released yet — proceeding."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      id-token: write      # Required for attestation signing
      contents: write      # Required to create the GitHub Release (and tag)
      attestations: write  # Required to write the attestation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Attest plugin files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Extract release notes
        id: changelog
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          NOTES=$(awk "/^## $VERSION/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
          {
            echo "notes<<CHANGELOG_SECTION"
            echo "$NOTES"
            echo "CHANGELOG_SECTION"
          } >> "$GITHUB_OUTPUT"

      # Creates the tag at this commit and attaches the three files that are
      # the plugin.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.version }}
          name: ${{ needs.check.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            main.js
            manifest.json
            styles.css

      # Verify each attested file before finishing, so a genuine digest or
      # signature mismatch fails the run loudly while a transient indexing lag
      # is retried here instead of surfacing as an external report.
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in main.js manifest.json styles.css; do
            echo "::group::Verifying $f"
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"; then
                echo "$f verified on attempt $attempt"
                break
              fi
              if [ "$attempt" = "5" ]; then
                echo "::error::Attestation verification failed for $f after $attempt attempts."
                exit 1
              fi
              echo "Attestation for $f not verifiable yet (attempt $attempt) — retrying in 15s to allow indexing…"
              sleep 15
            done
            echo "::endgroup::"
          done
